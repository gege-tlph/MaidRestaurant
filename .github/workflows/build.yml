name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Maid Restaurant compiles against the unofficial TouhouLittleMaid Fabric
      # port, which is not published to a Maven repository. Fetch the pinned
      # release asset into libs/, where build.gradle looks for it by default.
      - name: Fetch TouhouLittleMaid dev jar
        env:
          TLM_JAR: touhoulittlemaid-fabric-0.8.4-neo1.5.3+mc1.21.11.jar
          TLM_URL: https://github.com/gege-tlph/TouhouLittleMaid-Tsumugi/releases/download/v0.8.4%2Bmc1.21.11/touhoulittlemaid-fabric-0.8.4-neo1.5.3%2Bmc1.21.11.jar
        run: |
          mkdir -p libs
          curl -fsSL -o "libs/$TLM_JAR" "$TLM_URL"

      - name: Build with Gradle
        run: ./gradlew build
