plugins {
    id 'fabric-loom' version '1.17.14'
    id 'maven-publish'
    id 'java-library'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

repositories {
    mavenCentral()
    maven {
        name = "GegePatchouli"
        url = "https://raw.githubusercontent.com/gege-tlph/Patchouli/maven/"
        content { includeGroup "vazkii.patchouli" }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        name = "CurseMaven"
        url = "https://www.cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
}

loom {
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            runDir("run")
        }
        datagen {
            server()
            name = "Data Generation"
            vmArg("-Dfabric-api.datagen")
            vmArg("-Dfabric-api.datagen.modid=${project.mod_id}")
            runDir("build/datagen")
        }
    }
}

sourceSets {
    main {
        resources {
            srcDir "src/generated/resources"
        }
        java {
            // Bakeries has no verified 1.21.11 Fabric artifact in the shared
            // workspace yet; its NeoForge-only adapters stay staged separately.
            exclude "com/mastermarisa/maid_restaurant/compat/bakeries/**"
            // GUI/rendering APIs changed substantially in 1.21.11; migrate
            // these client-only sources after the common gameplay layer.
            exclude "com/mastermarisa/maid_restaurant/client/gui/**"
            exclude "com/mastermarisa/maid_restaurant/client/render/**"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"

    // Local development contract for the completed Fabric 1.21.11 TLM port.
    // This path is intentionally optional for published builds; set TLM_DEV_JAR
    // to another jar when working outside the shared workspace.
    def tlmJar = providers.environmentVariable("TLM_DEV_JAR")
            .orElse("${rootProject.projectDir}/../../claude/build/libs/touhoulittlemaid-fabric-0.8.4-neo1.5.3+mc1.21.11.jar")
    modCompileOnly files(tlmJar.get())
    if (file(tlmJar.get()).exists()) {
        modLocalRuntime files(tlmJar.get())
    }

    modCompileOnly("vazkii.patchouli:Patchouli:1.21.11-94.1-FABRIC") {
        transitive = false
    }
    modCompileOnly "maven.modrinth:kaleidoscope-cookery-refabricated:1.3.0.9-fabric+mc1.21.11"
    modCompileOnly "maven.modrinth:farmers-delight-refabricated:1.21.11-3.4.9"
    modLocalRuntime "maven.modrinth:kaleidoscope-cookery-refabricated:1.3.0.9-fabric+mc1.21.11"
    modLocalRuntime "maven.modrinth:farmers-delight-refabricated:1.21.11-3.4.9"

    modLocalRuntime "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:21.11.1"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

java {
    withSourcesJar()
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}
