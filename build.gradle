plugins {
    id 'fabric-loom' version '1.17.14'
    id 'maven-publish'
    id 'java-library'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

repositories {
    mavenCentral()
    maven {
        name = "GegePatchouli"
        url = "https://raw.githubusercontent.com/gege-tlph/Patchouli/maven/"
        content { includeGroup "vazkii.patchouli" }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        name = "CurseMaven"
        url = "https://www.cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
}

loom {
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            // Keep client-only runtime mods (for example IMBlocker) out of the
            // dedicated-server instance entirely.
            runDir("run/client")
        }
        server {
            server()
            setConfigName("Fabric Server")
            runDir("run/server")
        }
        datagen {
            server()
            name = "Data Generation"
            vmArg("-Dfabric-api.datagen")
            vmArg("-Dfabric-api.datagen.modid=${project.mod_id}")
            vmArg("-Dfabric-api.datagen.output-dir=${project.projectDir}/build/datagen/generated")
            runDir("build/datagen")
        }
    }
}

sourceSets {
    main {
        resources {
            srcDir "src/generated/resources"
        }
    }
}

def tlmJarName = "touhoulittlemaid-fabric-0.8.4-neo1.5.3+mc1.21.11.jar"
def tlmJarUrl = "https://github.com/gege-tlph/TouhouLittleMaid-Tsumugi/releases/download/v0.8.4%2Bmc1.21.11/touhoulittlemaid-fabric-0.8.4-neo1.5.3%2Bmc1.21.11.jar"
def tlmJar = file(providers.environmentVariable("TLM_DEV_JAR")
        .orElse("${rootProject.projectDir}/libs/${tlmJarName}").get())
def tlmMissingHint = """TouhouLittleMaid dev jar not found at ${tlmJar}
  Set TLM_DEV_JAR to your own build of the port, or fetch the pinned release:
  curl -fsSL --create-dirs -o "libs/${tlmJarName}" ${tlmJarUrl}
"""

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"

    // The unofficial TouhouLittleMaid Fabric port is not published to a Maven
    // repository, so the jar is taken from TLM_DEV_JAR when that is set and
    // from libs/ otherwise. The CI workflow downloads the pinned release asset
    // into libs/; locally, drop the jar there or point TLM_DEV_JAR at your own
    // build of the port.
    if (tlmJar.exists()) {
        modCompileOnly files(tlmJar)
        modLocalRuntime files(tlmJar)
    } else {
        logger.warn("WARNING: ${tlmMissingHint}")
    }

    modCompileOnly("vazkii.patchouli:Patchouli:1.21.11-94.1-FABRIC") {
        transitive = false
    }
    // Patchouli's published POM pins a newer loader than this Loom toolchain
    // and would otherwise put two Fabric Loader versions on the dev runtime.
    // Keep the POM dependencies out, then expose its bundled Fiber version
    // explicitly because Loom does not put nested jars on this dev classpath.
    modLocalRuntime("vazkii.patchouli:Patchouli:1.21.11-94.1-FABRIC") {
        transitive = false
    }
    modLocalRuntime("me.zeroeightsix:fiber:0.23.0-2") {
        transitive = false
    }
    modCompileOnly "maven.modrinth:kaleidoscope-cookery-refabricated:1.3.0.9-fabric+mc1.21.11"
    modCompileOnly "maven.modrinth:farmers-delight-refabricated:1.21.11-3.4.9"
    modLocalRuntime "maven.modrinth:kaleidoscope-cookery-refabricated:1.3.0.9-fabric+mc1.21.11"
    modLocalRuntime "maven.modrinth:farmers-delight-refabricated:1.21.11-3.4.9"

    modLocalRuntime "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:21.11.1"
}

def resourceVersion = version.toString()

processResources {
    inputs.property "version", resourceVersion
    filesMatching("fabric.mod.json") {
        expand "version": resourceVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
    doFirst {
        if (!tlmJar.exists()) {
            throw new GradleException(tlmMissingHint)
        }
    }
}

java {
    withSourcesJar()
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}
